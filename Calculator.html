<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; margin-top: 50px; background: #eef2f3; }
        .calc { background: #333; padding: 20px; border-radius: 10px; width: 220px; }
        #display { width: 100%; height: 40px; font-size: 20px; text-align: right; margin-bottom: 10px; background: #fff; }
        .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
        button { padding: 15px; font-size: 16px; cursor: pointer; background: #f0f0f0; border: none; }
        button.op { background: #ff9800; color: white; }
    </style>
</head>
<body>
    <div class="calc">
        <input type="text" id="display" disabled>
        <div class="keys">
            <button onclick="clearBox()">C</button>
            <button onclick="appendValue('/')" class="op">/</button>
            <button onclick="appendValue('*')" class="op">*</button>
            <button onclick="appendValue('-')" class="op">-</button>
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('+')" class="op">+</button>
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="calculate()" class="op" style="grid-row: span 2; height: 100%;">=</button>
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendValue('.')">.</button>
        </div>
    </div>
    <script>
        function appendValue(val) { document.getElementById('display').value += val; }
        function clearBox() { document.getElementById('display').value = ''; }
        function calculate() { 
            try { document.getElementById('display').value = eval(document.getElementById('display').value); } 
            catch { document.getElementById('display').value = 'Error'; } 
        }
    </script>
</body>
</html>
